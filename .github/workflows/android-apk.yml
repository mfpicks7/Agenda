name: Compilar APK Mi Agenda

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      comprobar_arranque:
        description: Instalar y comprobar el arranque en Android 35
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  apk:
    name: Analizar, probar y compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Resolver dependencias y preparar Gradle
        run: bash tool/prepare_android.sh
      - name: Comprobar esquema SQLite
        run: python3 tool/check_schema.py
      - name: Dar formato y analizar
        run: |
          dart format lib test
          flutter analyze
      - name: Ejecutar pruebas Flutter
        run: flutter test --reporter expanded
      - name: Compilar APK debug
        run: |
          mkdir -p entrega
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk entrega/Mi-Agenda-debug.apk
          MI_AGENDA_RECOVERY=1 flutter build apk --debug --dart-define=RECOVERY_BUILD=true
          cp build/app/outputs/flutter-apk/app-debug.apk entrega/Mi-Agenda-Recuperacion.apk
      - name: Empaquetar APK y código resuelto
        run: |
          mkdir -p entrega
          cp pubspec.lock entrega/pubspec.lock
          sha256sum entrega/*.apk > entrega/SHA256SUMS.txt
          flutter --version > entrega/FLUTTER_VERSION.txt
          git ls-files -z -- lib test android pubspec.yaml analysis_options.yaml tool .github README.md VERIFICACION.md > /tmp/mi-agenda-sources
          tar --null -T /tmp/mi-agenda-sources -czf entrega/codigo-verificado.tar.gz pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: Mi-Agenda-APK-debug
          path: entrega/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Mi-Agenda-Recuperacion
          path: entrega/Mi-Agenda-Recuperacion.apk
          if-no-files-found: error
          retention-days: 14

  arranque:
    name: Instalar y abrir en Android 35
    if: ${{ github.event_name == 'push' || inputs.comprobar_arranque }}
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Mi-Agenda-APK-debug
          path: entrega
      - name: Habilitar KVM del runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            bash tool/android_smoke.sh entrega/Mi-Agenda-debug.apk
            python3 tool/notification_smoke.py
            python3 tool/recovery_smoke.py
      - name: Vista del calendario en el emulador de prueba
        if: always()
        run: |
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path
          path = Path('smoke-results/avisos-fallo.png')
          if not path.exists():
              path = Path('smoke-results/reapertura.png')
          if not path.exists():
              raise SystemExit(0)
          content = base64.b64encode(path.read_bytes()).decode()
          print('CALENDAR_PREVIEW_BEGIN')
          for offset in range(0, len(content), 4096):
              print(content[offset:offset + 4096])
          print('CALENDAR_PREVIEW_END')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mi-Agenda-Arranque-Android35
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
